train:
  _target_: fastwam.datasets.nuscenes.nuscenes_video_dataset.NuScenesVideoDataset
  dataroot: ${oc.env:NUSCENES_DATAROOT,./data/nuscenes}
  version: v1.0-mini
  split: train
  camera_key: CAM_FRONT
  shape_meta:
    images:
      - key: CAM_FRONT
        raw_shape: [3, 900, 1600]
        shape: [3, 224, 400]
    action:
      - key: default
        raw_shape: 3   # (dx, dy, dyaw) in anchor ego frame
        shape: 3
    state:
      - key: default
        raw_shape: 4   # (v_x, v_y, yaw_rate, speed) in ego frame
        shape: 4
  num_frames: 9
  action_video_freq_ratio: 1     # T_video=9, T_action=8; 4s window at 2 Hz keyframes
  video_size: [224, 400]         # final dataset-level resize/crop, both divisible by 16
  global_sample_stride: 1
  is_training_set: true
  skip_padding_as_possible: false
  override_instruction: "Front-view driving scene from a moving vehicle."
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 1
    action_output_dim: 3
    proprio_output_dim: 4
    delta_action_dim_mask: null
    action_state_transforms: null
    use_stepwise_action_norm: false
    norm_default_mode: z-score
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 400]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 400]
  text_embedding_cache_dir: ./data/text_embeds_cache/nuscenes
  context_len: 128

val:
  _target_: fastwam.datasets.nuscenes.nuscenes_video_dataset.NuScenesVideoDataset
  dataroot: ${oc.env:NUSCENES_DATAROOT,./data/nuscenes}
  version: ${data.train.version}
  split: val
  camera_key: ${data.train.camera_key}
  shape_meta: ${data.train.shape_meta}
  num_frames: ${data.train.num_frames}
  action_video_freq_ratio: ${data.train.action_video_freq_ratio}
  video_size: ${data.train.video_size}
  global_sample_stride: 1
  is_training_set: false
  skip_padding_as_possible: false
  override_instruction: ${data.train.override_instruction}
  processor: ${data.train.processor}
  text_embedding_cache_dir: ${data.train.text_embedding_cache_dir}
  context_len: ${data.train.context_len}
  pretrained_norm_stats: null   # runtime.build_datasets passes the actual path at instantiate time
