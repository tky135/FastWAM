_target_: fastwam.runtime.create_fastwam
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: true
# Set to a local path to load DiT + VAE + T5 + tokenizer directly from one official
# Wan2.2-TI2V-5B checkpoint dir (bypasses DiffSynth-Studio; VAE loads at fp32, matching
# the official pipeline). null = use model_id + the DiffSynth redirect (legacy default).
local_dir: null
mot_checkpoint_mixed_attn: true
# Tiny config: train DiT from scratch with much smaller dims. Useful for smoke-testing
# the training pipeline on memory-constrained hardware (single ~96 GB GPU, etc.).
# Random-init only — won't produce usable video/action; use the full fastwam.yaml on
# better hardware for actual training.
action_dit_pretrained_path: null
skip_dit_load_from_pretrain: true

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 1024        # was 3072
  ffn_dim: 4096           # was 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 8            # was 24  (must match action expert)
  attn_head_dim: 128      # (must match action expert; 8 * 128 = 1024 = hidden_dim)
  num_layers: 6           # was 30  (must match action expert)
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: "first_frame_causal"
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: "group_diagonal"

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024        # was 1024 (kept same — already small)
  ffn_dim: 4096           # was 4096
  num_heads: 8            # was 24   (must match video expert)
  attn_head_dim: 128      # (must match video expert)
  num_layers: 6           # was 30   (must match video expert)
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_action: 1.0
