# @package _global_

defaults:
  - override /data: nuscenes_dense_1cam224
  - override /model: fastwam
  - _self_

# dataloading
batch_size: 1            # 49 frames @ 224x384 = ~1,092 video tokens/sample
num_workers: 8           # 49 JPEG decodes/sample (~5.4x the keyframe path) -> keep high

model:
  # ~1,092 video tokens at 224x384 -> O(N^2) MoT attention is cheap; no gradient
  # checkpointing needed (matches the small-res libero configs).
  mot_checkpoint_mixed_attn: false

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 5
max_steps: null
log_every: 10
save_every: 5000
eval_every: 200

# training
gradient_accumulation_steps: 4
weight_decay: 1e-2
resume: null
